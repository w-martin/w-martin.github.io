      <stop offset="0" stop-color="#93c4ec" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#93c4ec" stop-opacity=".16"/>
      <stop offset="1" stop-color="#93c4ec" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="#1e1b18"/>
  <circle cx="256" cy="256" r="240" fill="url(#g)"/>
  <g fill="none" stroke="#f1ece0" stroke-width="30" stroke-linecap="round">
    <circle cx="256" cy="256" r="84"/>
